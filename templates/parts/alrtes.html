<div class="message-container text-center">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}" role="alert">
                <h5><b>{{ message }}</b></h5>
            </div>
        {% endfor %}
    {% endif %}
</div>

<script>
    $(document).ready(function() {
        setTimeout(function() {
            $('.message-container').fadeOut('slow');
        }, 2000);
    });
</script>
